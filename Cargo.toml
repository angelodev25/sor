[package]
name = "sor"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.15.3"
biquad = "0.6.0"
rtrb = "0.4.0"
slint = "1.17.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
id3 = "1.17.1"
lofty = "0.25.1"
lucide-slint = "0.1.4"

[build-dependencies]
slint-build = "1.17.1"
lucide-slint = "0.1.4"

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3
debug = false
